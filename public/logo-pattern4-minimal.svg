<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Pattern 4: ミニマルドット型 -->
  <g transform="translate(10, 18)">
    <!-- M letter stylized -->
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#2563eb">M</text>
    <!-- Dot accent (the "spot") -->
    <circle cx="46" cy="44" r="7" fill="#f59e0b"/>
  </g>
  <!-- Full name -->
  <text x="68" y="46" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2937">oneySpot</text>
  <line x1="68" y1="56" x2="260" y2="56" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="68" y="72" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" letter-spacing="2">CURRENCY EXCHANGE FINDER</text>
</svg>
