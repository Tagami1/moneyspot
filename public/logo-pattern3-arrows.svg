<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Pattern 3: 通貨記号 + 矢印（両替イメージ） -->
  <g transform="translate(8, 15)">
    <!-- Rounded square background -->
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#2563eb"/>
    <!-- Currency arrows -->
    <text x="15" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">¥</text>
    <path d="M28 28 L38 28" stroke="white" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
    <text x="40" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">$</text>
    <text x="15" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">€</text>
    <path d="M28 48 L38 48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="40" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">£</text>
  </g>
  <!-- Text -->
  <text x="82" y="48" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#2563eb">Money</text>
  <text x="234" y="48" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#1f2937">Spot</text>
  <text x="82" y="68" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">Best exchange rates, everywhere</text>
</svg>
