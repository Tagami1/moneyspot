<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Pattern 2: 円形コイン型 MS アイコン -->
  <g transform="translate(10, 10)">
    <!-- Outer coin ring -->
    <circle cx="40" cy="40" r="38" fill="#2563eb"/>
    <circle cx="40" cy="40" r="32" fill="white"/>
    <circle cx="40" cy="40" r="30" fill="#2563eb" opacity="0.05"/>
    <!-- MS letters -->
    <text x="40" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#2563eb">MS</text>
    <!-- Small dot accent -->
    <circle cx="62" cy="22" r="5" fill="#f59e0b"/>
  </g>
  <!-- Text -->
  <text x="100" y="48" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#2563eb">Money</text>
  <text x="252" y="48" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#1f2937">Spot</text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="3">EXCHANGE RATE FINDER</text>
</svg>
