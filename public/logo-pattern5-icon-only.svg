<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Pattern 5: アイコンのみ（アプリアイコン向け） -->
  <!-- Rounded square background -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#2563eb"/>
  <!-- Inner circle (coin) -->
  <circle cx="60" cy="56" r="34" fill="white" opacity="0.95"/>
  <!-- MS text -->
  <text x="60" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#2563eb">MS</text>
  <!-- Location dot -->
  <circle cx="60" cy="96" r="5" fill="#fbbf24"/>
  <!-- Small pin line -->
  <line x1="60" y1="90" x2="60" y2="93" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
</svg>
